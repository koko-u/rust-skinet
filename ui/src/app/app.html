<sk-header/>
<div class="mx-auto max-w-7xl px-4 py-4 sm:px-6 lg:px-8">
  <h2 class="text-3xl font-bold text-green-700 mb-4">Welcome to {{ title() }}</h2>

  @if (products.hasValue()) {
    <sk-products-table [products]="products.value().items"/>
  } @else if (products.error()) {
    <sk-alert title="Error" message="Could not load products" [alertType]="'danger'"/>
  } @else if (products.isLoading()) {
    <div>
      <mat-spinner></mat-spinner>
      <span class="ms-2">Loading Products...</span>
    </div>
  }
</div>

<router-outlet/>
