<div class="overflow-x-auto">
  <table class="w-full border-collapse text-left text-sm text-slate-900">
    <caption class="sr-only">Products</caption>
    <thead class="bg-violet-100">
      <tr>
        <th scope="col" class="px-4 py-3 font-medium">Name</th>
        <th scope="col" class="px-4 py-3 text-right font-medium">Price</th>
        <th scope="col" class="px-4 py-3 font-medium">Product Type</th>
        <th scope="col" class="px-4 py-3 font-medium">Product Brand</th>
        <th scope="col" class="px-4 py-3 text-center font-medium">Quantity In Stock</th>
        <th scope="col" class="px-4 py-3 text-center font-medium">Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (product of products(); track product.id) {
        <tr class="border-b border-slate-200 even:bg-slate-100 hover:bg-slate-200">
          <td class="px-4 py-3">{{ product.name }}</td>
          <td class="whitespace-nowrap px-4 py-3 text-right tabular-nums">
            {{ product.price | currency: 'USD' : 'symbol-narrow' : '1.2-2' }}
          </td>
          <td class="px-4 py-3">{{ product.productType }}</td>
          <td class="px-4 py-3">{{ product.productBrand }}</td>
          <td class="px-4 py-3 text-center tabular-nums">{{ product.quantityInStock }}</td>
          <td class="whitespace-nowrap px-4 py-3 text-center">
            <button matButton="text">Edit</button>
            <button matButton="text">View</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
