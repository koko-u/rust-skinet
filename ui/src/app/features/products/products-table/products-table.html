<table mat-table [dataSource]="products()">

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let product">{{ product.name }}</td>
  </ng-container>

  <ng-container matColumnDef="price">
    <th mat-header-cell class="text-right!" *matHeaderCellDef>Price</th>
    <td mat-cell class="text-right!"
        *matCellDef="let product">{{ product.price | currency:"USD":"symbol-narrow":"1.2-2" }}
    </td>
  </ng-container>

  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef>Product Type</th>
    <td mat-cell *matCellDef="let product">{{ product.productType }}</td>
  </ng-container>

  <ng-container matColumnDef="brand">
    <th mat-header-cell *matHeaderCellDef>Product Brand</th>
    <td mat-cell *matCellDef="let product">{{ product.productBrand }}</td>
  </ng-container>

  <ng-container matColumnDef="stock">
    <th mat-header-cell *matHeaderCellDef>Quantity In Stock</th>
    <td mat-cell class="text-center!" *matCellDef="let product">{{ product.quantityInStock }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell class="text-center!" *matHeaderCellDef>Actions</th>
    <td mat-cell class="text-center!" *matCellDef="let product">
      <button matButton="text">Edit</button>
      <button matButton="text">View</button>
    </td>
  </ng-container>

  @let columns = ['name', 'price', 'type', 'brand', 'stock', 'actions'];
  <tr mat-header-row class="bg-violet-100!" *matHeaderRowDef="columns"></tr>
  <tr mat-row class="even:bg-slate-100! hover:bg-slate-200!" *matRowDef="let row; columns: columns"></tr>
</table>
